[background]
mode = "file"
path = "~/.config/veila/wallpaper-blur.png"
color = "#413249"
dim_strength = 0

[background.radial]
center = "#373057"
edge = "#1F1B2E"
center_x = 50
center_y = 50
radius = 80

[battery]
enabled = true

[weather]
enabled = false

[visuals.clock]
format = "24h"
meridiem_font_size = 22
meridiem_x = 6
meridiem_y = 7
font_family = "Geom"
font_weight = 600
color = "#beafe9d0"
font_size = 88
halign = "center"
valign = "top"
x = 0
y = 40

[visuals.date]
format = "long"
font_family = "SF Pro"
font_weight = 600
font_size = 18
color = "#beafe9a0"
halign = "center"
valign = "top"
x = 0
y = 140

[visuals.input]
placeholder = "Enter Password"
background_color = "#231e2d5f"
mode = "blur"
blur_strength = 12
width = 280 
height = 40 
radius = 10
mask_color = "#beafe9a0"
font_family = "SF Pro"
font_weight = 400
font_size = 16
halign = "center"
valign = "bottom"
x = 0
y = -60 

[visuals.status]
mode = "inline"
rejected_color = "#8e5fb9d0" 
pending_color = "#beafe9a0"

[visuals.eye]
color = "rgba(255, 255, 255, 0.72)"

[visuals.caps_lock]
color = "rgba(255, 255, 255, 0.52)"

[visuals.placeholder]
color = "#beafe9a0"

# Theres probably a better way to hide this lol
[visuals.avatar]
# image_path = "/path/to/avatar.jpg"
size = 0
background_color = "rgba(255, 255, 255, 0.04)"
placeholder_padding = 28
halign = "center"
valign = "center"
x = 0
y = 6000

[visuals.username]
enabled = false
font_family = "SF Pro"
font_weight = 400
color = "rgba(255, 255, 255, 0.84)"
font_size = 28
halign = "center"
valign = "center"
x = 0
y = 0

[visuals.keyboard]
background_size = 46
radius = 23
background_color = "rgba(255, 255, 255, 0.04)"
color = "rgba(255, 255, 255, 0.68)"
size = 16
halign = "right"
valign = "top"
x = -24
y = 21

[visuals.battery]
background_color = "rgba(255, 255, 255, 0.04)"
background_size = 46
radius = 23
color = "rgba(255, 255, 255, 0.68)"
size = 20
halign = "right"
valign = "top"
x = -78
y = 21

[visuals.weather.icon]
size = 40
opacity = 80
halign = "left"
valign = "bottom"
x = 40
y = -112

[visuals.weather.temperature]
font_size = 40
font_family = "Geom"
font_weight = 600
letter_spacing = 0
color = "rgba(255, 255, 255, 0.73)"
halign = "left"
valign = "bottom"
x = 40
y = -70

[visuals.weather.location]
font_size = 22
font_family = "SF Pro"
font_weight = 400
color = "rgba(214, 227, 255, 0.58)"
halign = "left"
valign = "bottom"
x = 40
y = -44

[visuals.now_playing]
enabled = true
fade_duration_ms = 320

[visuals.now_playing.artwork]
size = 64 
radius = 8
opacity = 90
halign = "left"
valign = "center"
x = 10
y = 0
relative_to = "now_playing"

[visuals.now_playing.artist]
width = 318
color = "#beafe9d0"
font_family = "SF Pro"
font_size = 18
font_weight = 400
halign = "left"
valign = "top"
x = 96 
y = 10
relative_to = "now_playing"

[visuals.now_playing.title]
width = 318
color = "#beafe9a0"
font_family = "SF Pro"
font_size = 16
font_weight = 400
halign = "left"
valign = "bottom"
x = 96 
y = -32
relative_to = "now_playing"

# Now playing backdrop
[[visuals.backdrop]]
enabled = true
name = "now_playing"
show_when = "now_playing"
mode = "blur"
color = "#231e2d5f"
blur_strength = 12
radius = 10
border_color = "#231e2d"
width = 400
height = 80 
halign = "right"
valign = "bottom"
x = -40
y = -40
z = 0
